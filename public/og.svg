<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <style>
            .bg     { fill: oklch(0.985 0.005 70); }
            .text   { fill: oklch(0.180 0.012 70); font-family: 'Source Serif 4', 'Iowan Old Style', 'Apple Garamond', 'Baskerville', 'Times New Roman', serif; font-weight: 500; }
            .meta   { fill: oklch(0.420 0.012 70); font-family: 'Hanken Grotesk', -apple-system, 'Segoe UI', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
            .role   { fill: oklch(0.420 0.012 70); font-family: 'Hanken Grotesk', -apple-system, 'Segoe UI', system-ui, sans-serif; font-weight: 400; }
            .accent { fill: oklch(0.50 0.16 30); font-family: 'Hanken Grotesk', -apple-system, 'Segoe UI', system-ui, sans-serif; font-weight: 600; }
            .rule   { stroke: oklch(0.880 0.008 70); stroke-width: 1; }
        </style>
    </defs>

    <!-- Paper background -->
    <rect class="bg" width="1200" height="630" />

    <!-- Top eyebrow -->
    <text class="meta" x="80" y="100" font-size="18">JAIME ASTUDILLO · QUITO, ECUADOR</text>
    <line class="rule" x1="80" y1="130" x2="1120" y2="130" />

    <!-- Name (serif, large) -->
    <text class="text" x="80" y="290" font-size="112" letter-spacing="-3">Jaime Astudillo</text>

    <!-- Role -->
    <text class="role" x="80" y="370" font-size="36">Forward-Deployed AI Engineer</text>
    <text class="role" x="80" y="418" font-size="28">LLM systems · Computer Vision · Published researcher</text>

    <!-- Bottom rule + meta strip -->
    <line class="rule" x1="80" y1="510" x2="1120" y2="510" />
    <text class="meta" x="80" y="550" font-size="18">.NET 8  ·  PYTHON  ·  REACT  ·  LLMs</text>
    <text class="accent" x="80" y="586" font-size="20">4 peer-reviewed papers · 1× first author (Springer 2023)</text>
</svg>
